<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LedgerLine – Your account</title>
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<meta name="theme-color" content="#06050d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#06050d;--ink2:#0f0b20;--line:rgba(255,255,255,.1);--text:#f3f0ff;--mute:#a9a3c7;--vio:#7c5cff;--cy:#41e0ff;--gold:#ffc861;--red:#ff7a8a;--grn:#4be3a1;--glass:rgba(255,255,255,.045)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--ink);color:var(--text);font:400 1rem/1.6 Figtree,system-ui,sans-serif;min-height:100vh}
h1,h2,h3{font-family:'Bricolage Grotesque',system-ui,sans-serif;letter-spacing:-.02em;line-height:1.1;font-weight:700}
a{color:inherit;text-decoration:none}[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--cy);outline-offset:3px;border-radius:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:12px 22px;border-radius:999px;font:600 .95rem Figtree;border:1px solid var(--line);cursor:pointer;color:var(--text);background:var(--glass);transition:transform .2s}
.btn:hover{transform:translateY(-2px)}
.btn.pri{background:linear-gradient(135deg,var(--vio),#4f8bff 60%,var(--cy));border:0;color:#fff;box-shadow:0 10px 34px -10px var(--vio)}
.btn.sm{padding:7px 14px;font-size:.84rem}.btn.red{color:var(--red)}
input,select{width:100%;padding:13px 16px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--text);font:inherit}
input:focus,select:focus{border-color:var(--vio);outline:0}
select option{background:var(--ink2)}
label{display:block;font-size:.88rem;color:var(--mute);margin:14px 0 6px}
.logo{font:700 1.3rem 'Bricolage Grotesque';display:flex;align-items:center;gap:10px}
/* auth */
#auth{display:grid;grid-template-columns:1.1fr 1fr;min-height:100vh}
.left{position:relative;padding:40px 48px;display:flex;flex-direction:column;justify-content:space-between;background:radial-gradient(70% 60% at 50% 55%,rgba(124,92,255,.38),transparent 70%)}
#coin{position:absolute;inset:0;width:100%;height:100%}
.left>*:not(canvas){position:relative;z-index:1}
.left h1{font-size:clamp(2rem,3.6vw,3.2rem);max-width:11em}
.left ul{list-style:none;color:var(--mute);margin-top:22px}
.left li::before{content:"✓";color:var(--cy);margin-right:10px}
.right{display:grid;place-items:center;padding:32px}
.form{width:100%;max-width:440px;background:linear-gradient(160deg,rgba(255,255,255,.08),rgba(255,255,255,.02));border:1px solid var(--line);border-radius:28px;padding:36px}
.form h2{font-size:1.8rem;margin-bottom:6px}.form .sub{color:var(--mute);margin-bottom:10px}
.dots{display:flex;gap:6px;margin-bottom:22px}.dots i{flex:1;height:4px;border-radius:9px;background:var(--line)}.dots i.on{background:var(--cy)}
.opts{display:grid;gap:10px;margin:16px 0 22px}
.opt{padding:14px 18px;border-radius:16px;border:1px solid var(--line);background:var(--glass);cursor:pointer;text-align:left;color:var(--text);font:500 1rem Figtree;display:flex;justify-content:space-between}
.opt small{color:var(--mute);font-weight:400}
.opt[aria-pressed=true]{border-color:var(--cy);background:rgba(65,224,255,.1)}
.row{display:flex;gap:10px;align-items:center}.row .btn{flex:1}
.err{color:var(--red);font-size:.9rem;margin-top:12px;min-height:1.2em}
.alt{margin-top:18px;color:var(--mute);font-size:.92rem;text-align:center}.alt a{color:var(--cy)}
.demo{background:rgba(255,200,97,.12);border:1px solid rgba(255,200,97,.35);color:var(--gold);padding:10px 14px;border-radius:12px;font-size:.84rem;margin-bottom:18px}
/* app shell */
#app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
aside{padding:26px 18px;border-right:1px solid var(--line);background:var(--ink2);display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
aside .logo{padding:0 10px 22px}
aside a.nav{padding:11px 14px;border-radius:14px;color:var(--mute);font-weight:500}
aside a.nav:hover{color:var(--text);background:var(--glass)}
aside a.nav.on{color:var(--text);background:linear-gradient(135deg,rgba(124,92,255,.35),rgba(65,224,255,.12));box-shadow:inset 0 0 0 1px rgba(124,92,255,.5)}
.trial{margin-top:auto;padding:16px;border-radius:18px;border:1px solid var(--line);background:var(--glass);font-size:.9rem;color:var(--mute)}
.trial b{display:block;color:var(--gold);font:700 1.3rem 'Bricolage Grotesque'}
main{padding:36px 40px 70px;background:radial-gradient(50% 40% at 85% 0,rgba(124,92,255,.22),transparent 70%);min-width:0}
.top{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:14px;margin-bottom:28px}
.top h1{font-size:2.2rem}.top p{color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;perspective:1100px;margin-bottom:18px}
.card{background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.02));border:1px solid var(--line);border-radius:22px;padding:22px;transition:transform .25s ease-out;transform-style:preserve-3d;min-width:0}
.card h3{font-size:1.15rem;margin-bottom:14px}
.kpi small{color:var(--mute);font-size:.88rem}.kpi b{display:block;font:700 1.9rem 'Bricolage Grotesque';letter-spacing:-.03em;margin-top:4px}
.pos{color:var(--grn)}.neg{color:var(--red)}
.two{display:grid;grid-template-columns:1.3fr 1fr;gap:14px}
.bars{display:flex;gap:14px;align-items:flex-end;height:170px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end;font-size:.78rem;color:var(--mute)}
.bars span{display:flex;gap:4px;align-items:flex-end;height:100%;width:100%;justify-content:center}
.bars i{width:40%;max-width:22px;border-radius:7px 7px 2px 2px;min-height:3px}
.bars i.a{background:linear-gradient(var(--cy),var(--vio))}.bars i.b{background:var(--gold)}
.tbl{width:100%;border-collapse:collapse;font-size:.94rem}
.tbl th{text-align:left;color:var(--mute);font-weight:500;padding:10px 8px;border-bottom:1px solid var(--line)}
.tbl td{padding:12px 8px;border-bottom:1px solid var(--line)}.tbl .r{text-align:right}
.wrapx{overflow-x:auto}
.pill{font-size:.78rem;padding:3px 10px;border-radius:99px;border:1px solid var(--line)}
.pill.paid{color:var(--grn);border-color:rgba(75,227,161,.4)}.pill.unpaid{color:var(--gold);border-color:rgba(255,200,97,.4)}
.frm{display:grid;grid-template-columns:repeat(5,1fr) auto;gap:10px;align-items:end}
.frm label{margin:0 0 5px}
.empty{color:var(--mute);padding:26px 0;text-align:center}
.stm td:first-child{padding-left:0}.stm tr.tot td{font-weight:700;border-top:1px solid var(--mute)}
@media(max-width:960px){
 #auth{grid-template-columns:1fr}.left{min-height:260px;padding:28px}.left ul{display:none}
 #app{grid-template-columns:1fr}
 aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap;padding:14px;align-items:center}aside .logo{padding:0 10px 0 0}.trial{display:none}
 main{padding:24px 18px 60px}.grid{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}.frm{grid-template-columns:1fr 1fr}
}
@media print{aside,.noprint{display:none!important}#app{display:block}main{background:#fff;color:#000;padding:0}.card{background:none;border:1px solid #ccc;color:#000}.tbl th,.tbl td{color:#000;border-color:#ccc}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div id="auth" hidden>
 <div class="left">
  <canvas id="coin" aria-hidden="true"></canvas>
  <a href="/" class="logo"><img src="/logo.svg" width="30" height="30" alt="">LedgerLine</a>
  <div><h1>Your accounts, closed every month by someone who knows your name.</h1>
  <ul><li>14-day free trial</li><li>Fixed monthly fee, shown before you pay</li><li>Your data stays yours</li></ul></div>
  <small style="color:var(--mute)">© 2026 LedgerLine</small>
 </div>
 <div class="right"><div class="form" id="form"></div></div>
</div>

<div id="app" hidden>
 <aside>
  <a href="/" class="logo"><img src="/logo.svg" width="30" height="30" alt="">LedgerLine</a>
  <a class="nav" href="#dashboard">Dashboard</a>
  <a class="nav" href="#invoices">Invoices</a>
  <a class="nav" href="#ledger">Cash book</a>
  <a class="nav" href="#statements">Statements</a>
  <a class="nav" href="#settings">Settings</a>
  <div class="trial" id="trial"></div>
 </aside>
 <main id="page"></main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* ===== EDIT THESE ===== */
const SB_URL='https://gaivzkmhoutbnnxiojpd.supabase.co', SB_KEY='sb_publishable_JAaG3zdB7Tt2M8gDqDi-Rw_jMY-VrIk';   // Supabase project URL + anon key. Empty = demo mode (data stays in this browser).
/* ====================== */
const sb=(SB_URL&&window.supabase)?supabase.createClient(SB_URL,SB_KEY):null;
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SERV={in:['GST returns','TDS','ROC filings','ITR','PF and ESI','Bookkeeping','Payroll'],us:['Bookkeeping','Sales tax','1099 and W-2','Payroll','Financial model'],other:['Bookkeeping','Payroll','Financial model','Tax filings']};
const PLANS=[['Starter','Freelancers and sole proprietors'],['Growth','Growing small businesses'],['Scale','Multi-team businesses']];
let D=null,uid=null,W={step:0,country:'in',services:[],plan:'Growth'};
const today=()=>new Date().toISOString().slice(0,10),mk=d=>d.slice(0,7);
const M=n=>(D.profile.country==='in'?'₹':'$')+Number(n).toLocaleString(D.profile.country==='in'?'en-IN':'en-US',{maximumFractionDigits:2});
const sum=(a,f)=>a.filter(f).reduce((s,x)=>s+x.amount,0);

/* ---------- data layer: Supabase if configured, else localStorage ---------- */
async function load(){
 if(sb){const{data}=await sb.from('userdata').select('doc').eq('user_id',uid).maybeSingle();D=data?data.doc:null}
 else{const r=localStorage.getItem('ll_doc');D=r?JSON.parse(r):null}
}
async function save(){
 if(sb)await sb.from('userdata').upsert({user_id:uid,doc:D});
 else localStorage.setItem('ll_doc',JSON.stringify(D));
}

/* ---------- auth screens ---------- */
function authView(){
 $('#auth').hidden=false;$('#app').hidden=true;
 const f=$('#form'),login=location.hash==='#login',demo=sb?'':'<div class="demo">Demo mode: data stays in this browser until Supabase keys are added.</div>';
 if(login){
  f.innerHTML=`${demo}<h2>Welcome back</h2><p class="sub">Log in to your dashboard.</p>
  <form id="lf"><label for="e">Email</label><input id="e" type="email" required autocomplete="email"><label for="p">Password</label><input id="p" type="password" required autocomplete="current-password">
  <div class="err" id="err" role="alert"></div><button class="btn pri" style="width:100%;margin-top:10px">Log in</button></form>
  <p class="alt">New here? <a href="#signup">Start your free trial</a></p>`;
  $('#lf').onsubmit=async e=>{e.preventDefault();const em=$('#e').value.trim(),pw=$('#p').value;
   if(sb){const{data,error}=await sb.auth.signInWithPassword({email:em,password:pw});if(error)return $('#err').textContent=error.message;uid=data.user.id;await load();}
   else{const r=localStorage.getItem('ll_doc');if(!r||JSON.parse(r).profile.email!==em||localStorage.getItem('ll_pw')!==await sha(pw))return $('#err').textContent='Email or password does not match. Check them and try again.';D=JSON.parse(r)}
   if(!D)return $('#err').textContent='No account data found. Start your free trial first.';
   localStorage.setItem('ll_in','1');location.hash='#dashboard'};
  return;
 }
 const s=W.step,dots=`<div class="dots">${[0,1,2,3].map(i=>`<i class="${i<=s?'on':''}"></i>`).join('')}</div>`;
 let h=demo+dots;
 if(s===0)h+=`<h2>Where is your business?</h2><p class="sub">We’ll show the right services.</p><div class="opts">${[['in','India'],['us','United States'],['other','Another country']].map(([v,t])=>`<button class="opt" data-k="country" data-v="${v}" aria-pressed="${W.country===v}">${t}</button>`).join('')}</div>`;
 if(s===1)h+=`<h2>What do you need help with?</h2><p class="sub">Pick all that apply.</p><div class="opts">${SERV[W.country].map(x=>`<button class="opt" data-k="svc" data-v="${x}" aria-pressed="${W.services.includes(x)}">${x}</button>`).join('')}</div>`;
 if(s===2)h+=`<h2>Choose a plan</h2><p class="sub">Your exact price is shown before you pay.</p><div class="opts">${PLANS.map(([n,d])=>`<button class="opt" data-k="plan" data-v="${n}" aria-pressed="${W.plan===n}"><span>${n}<br><small>${d}</small></span></button>`).join('')}</div>`;
 if(s===3)h+=`<h2>Create your account</h2><p class="sub">Your 14-day free trial starts now.</p><label for="e">Email</label><input id="e" type="email" autocomplete="email"><label for="p">Password (8+ characters)</label><input id="p" type="password" autocomplete="new-password">`;
 h+=`<div class="err" id="err" role="alert"></div><div class="row">${s?'<button class="btn" id="bk">Back</button>':''}<button class="btn pri" id="nx">${s===3?'Start free trial':'Continue'}</button></div><p class="alt">Already have an account? <a href="#login">Log in</a></p>`;
 f.innerHTML=h;
 f.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const k=b.dataset.k,v=b.dataset.v;
  if(k==='country'){W.country=v;W.services=[]}else if(k==='plan')W.plan=v;else W.services=W.services.includes(v)?W.services.filter(x=>x!==v):[...W.services,v];authView()});
 if($('#bk'))$('#bk').onclick=()=>{W.step--;authView()};
 $('#nx').onclick=async()=>{
  if(s===1&&!W.services.length)return $('#err').textContent='Pick at least one service.';
  if(s<3){W.step++;return authView()}
  const em=$('#e').value.trim(),pw=$('#p').value;
  if(!/^\S+@\S+\.\S+$/.test(em))return $('#err').textContent='Enter a valid email address.';
  if(pw.length<8)return $('#err').textContent='Use a password with at least 8 characters.';
  D={profile:{email:em,country:W.country,services:W.services,plan:W.plan,trialEnd:Date.now()+14*864e5},entries:[],invoices:[]};
  if(sb){const{data,error}=await sb.auth.signUp({email:em,password:pw});if(error)return $('#err').textContent=error.message;
   if(!data.session){f.innerHTML='<h2>Check your email</h2><p class="sub">We sent a confirmation link to '+esc(em)+'. Open it, then log in.</p><p class="alt"><a href="#login">Go to log in</a></p>';return}
   uid=data.user.id}
  else localStorage.setItem('ll_pw',await sha(pw));
  await save();localStorage.setItem('ll_in','1');location.hash='#dashboard'};
}
async function sha(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}

/* ---------- app pages ---------- */
const head=(t,p,extra='')=>`<div class="top"><div><h1>${t}</h1><p>${p}</p></div><div class="noprint">${extra}</div></div>`;
const bal=()=>sum(D.entries,e=>e.type==='in')-sum(D.entries,e=>e.type==='out');
const empty=t=>`<div class="empty">${t}</div>`;

function dashboard(){
 const m=mk(today()),inn=sum(D.entries,e=>e.type==='in'&&mk(e.date)===m),out=sum(D.entries,e=>e.type==='out'&&mk(e.date)===m),due=sum(D.invoices,i=>i.status==='unpaid');
 const months=[...Array(6)].map((_,i)=>{const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-5+i);return d.toISOString().slice(0,7)});
 const data=months.map(k=>[k,sum(D.entries,e=>e.type==='in'&&mk(e.date)===k),sum(D.entries,e=>e.type==='out'&&mk(e.date)===k)]);
 const mx=Math.max(1,...data.flatMap(x=>[x[1],x[2]]));
 const rec=[...D.entries].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,6);
 return head('Dashboard','Here is where your money stands today.',`<a class="btn pri" href="#ledger">Add an entry</a>`)+
 `<div class="grid"><div class="card kpi tilt"><small>Cash balance</small><b class="${bal()<0?'neg':''}">${M(bal())}</b></div>
  <div class="card kpi tilt"><small>Money in this month</small><b class="pos">${M(inn)}</b></div>
  <div class="card kpi tilt"><small>Money out this month</small><b class="neg">${M(out)}</b></div>
  <div class="card kpi tilt"><small>Unpaid invoices</small><b>${M(due)}</b></div></div>
  <div class="two"><div class="card tilt"><h3>Last 6 months</h3><div class="bars">${data.map(([k,a,b])=>`<div><span><i class="a" style="height:${a/mx*100}%" title="In ${M(a)}"></i><i class="b" style="height:${b/mx*100}%" title="Out ${M(b)}"></i></span>${new Date(k+'-02').toLocaleString('en',{month:'short'})}</div>`).join('')}</div></div>
  <div class="card tilt"><h3>Recent entries</h3>${rec.length?`<table class="tbl"><tbody>${rec.map(e=>`<tr><td>${esc(e.category)}<br><small style="color:var(--mute)">${e.date}</small></td><td class="r ${e.type==='in'?'pos':'neg'}">${e.type==='in'?'+':'−'}${M(e.amount)}</td></tr>`).join('')}</tbody></table>`:empty('No entries yet. Add your first one in the cash book.')}</div></div>`;
}

function invoices(){
 const rows=[...D.invoices].reverse();
 return head('Invoices','Create invoices and mark them paid. Paid invoices go to your cash book.')+
 `<div class="card" style="margin-bottom:14px"><form id="iv" class="frm"><div><label>Client</label><input name="c" required></div><div><label>Amount</label><input name="a" type="number" min="0.01" step="0.01" required></div><div><label>Due date</label><input name="d" type="date" value="${today()}" required></div><div style="grid-column:span 2"><label>Description</label><input name="n"></div><button class="btn pri">Create invoice</button></form></div>
 <div class="card wrapx">${rows.length?`<table class="tbl"><thead><tr><th>No.</th><th>Client</th><th>Due</th><th>Status</th><th class="r">Amount</th><th></th></tr></thead><tbody>${rows.map(i=>`<tr><td>${i.no}</td><td>${esc(i.client)}<br><small style="color:var(--mute)">${esc(i.note)}</small></td><td>${i.due}</td><td><span class="pill ${i.status}">${i.status}</span></td><td class="r">${M(i.amount)}</td><td class="r">${i.status==='unpaid'?`<button class="btn sm" data-paid="${i.id}">Mark paid</button> `:''}<button class="btn sm red" data-del="${i.id}">Delete</button></td></tr>`).join('')}</tbody></table>`:empty('No invoices yet. Create your first one above.')}</div>`;
}

function ledger(){
 let r=0;const asc=[...D.entries].sort((a,b)=>a.date.localeCompare(b.date)||a.id-b.id).map(e=>(r+=e.type==='in'?e.amount:-e.amount,{...e,run:r})).reverse();
 return head('Cash book','Every rupee or dollar in and out, with a running balance.')+
 `<div class="card" style="margin-bottom:14px"><form id="lf" class="frm"><div><label>Date</label><input name="d" type="date" value="${today()}" required></div><div><label>Type</label><select name="t"><option value="in">Money in</option><option value="out">Money out</option></select></div><div><label>Category</label><input name="c" list="cats" required><datalist id="cats">${['Sales','Services','Rent','Salaries','Software','Travel','Taxes','Utilities'].map(x=>`<option>${x}`).join('')}</datalist></div><div><label>Amount</label><input name="a" type="number" min="0.01" step="0.01" required></div><div><label>Note</label><input name="n"></div><button class="btn pri">Add</button></form></div>
 <div class="card wrapx">${asc.length?`<table class="tbl"><thead><tr><th>Date</th><th>Category</th><th>Note</th><th class="r">In</th><th class="r">Out</th><th class="r">Balance</th><th></th></tr></thead><tbody>${asc.map(e=>`<tr><td>${e.date}</td><td>${esc(e.category)}</td><td>${esc(e.note)}</td><td class="r pos">${e.type==='in'?M(e.amount):''}</td><td class="r neg">${e.type==='out'?M(e.amount):''}</td><td class="r">${M(e.run)}</td><td class="r"><button class="btn sm red" data-del="${e.id}">Delete</button></td></tr>`).join('')}</tbody></table>`:empty('Your cash book is empty. Add money in or out above.')}</div>`;
}

let per='all';
function statements(){
 const m=mk(today()),cut=per==='m'?e=>mk(e.date)===m:per==='q'?e=>e.date>=new Date(Date.now()-90*864e5).toISOString().slice(0,10):()=>true;
 const E=D.entries.filter(cut),grp=t=>Object.entries(E.filter(e=>e.type===t).reduce((o,e)=>(o[e.category]=(o[e.category]||0)+e.amount,o),{})).sort((a,b)=>b[1]-a[1]);
 const inc=grp('in'),exp=grp('out'),ti=inc.reduce((s,x)=>s+x[1],0),to=exp.reduce((s,x)=>s+x[1],0),rec=sum(D.invoices,i=>i.status==='unpaid');
 const tb=(a)=>a.length?a.map(([k,v])=>`<tr><td>${esc(k)}</td><td class="r">${M(v)}</td></tr>`).join(''):`<tr><td colspan="2" style="color:var(--mute)">Nothing recorded</td></tr>`;
 return head('Financial statements','Built automatically from your cash book and invoices.',`<span class="seg noprint">${[['m','This month'],['q','Last 90 days'],['all','All time']].map(([v,t])=>`<button class="btn sm ${per===v?'pri':''}" data-per="${v}">${t}</button>`).join(' ')}</span> <button class="btn sm" id="pr">Print</button> <button class="btn sm" id="csv">Download CSV</button>`)+
 `<div class="two"><div class="card"><h3>Profit and loss</h3><table class="tbl stm"><tbody><tr><td><b>Income</b></td><td></td></tr>${tb(inc)}<tr class="tot"><td>Total income</td><td class="r">${M(ti)}</td></tr><tr><td><b>Expenses</b></td><td></td></tr>${tb(exp)}<tr class="tot"><td>Total expenses</td><td class="r">${M(to)}</td></tr><tr class="tot"><td>Net profit</td><td class="r ${ti-to<0?'neg':'pos'}">${M(ti-to)}</td></tr></tbody></table></div>
 <div class="card"><h3>Position today</h3><table class="tbl stm"><tbody><tr><td>Cash in hand</td><td class="r">${M(bal())}</td></tr><tr><td>Owed to you (unpaid invoices)</td><td class="r">${M(rec)}</td></tr><tr class="tot"><td>Total</td><td class="r">${M(bal()+rec)}</td></tr></tbody></table></div></div>`;
}

function settings(){
 const p=D.profile;
 return head('Settings','Your plan, your data.')+
 `<div class="two"><div class="card"><h3>Account</h3><table class="tbl"><tbody><tr><td>Email</td><td class="r">${esc(p.email)}</td></tr><tr><td>Country</td><td class="r">${{in:'India',us:'United States',other:'Other'}[p.country]}</td></tr><tr><td>Plan</td><td class="r">${p.plan}</td></tr><tr><td>Services</td><td class="r">${esc(p.services.join(', '))}</td></tr><tr><td>Trial ends</td><td class="r">${new Date(p.trialEnd).toLocaleDateString()}</td></tr></tbody></table></div>
 <div class="card"><h3>Your data</h3><p style="color:var(--mute);margin-bottom:16px">Export everything any time. It is yours.</p><div class="row" style="flex-wrap:wrap"><button class="btn" id="ex">Export all data</button><button class="btn" id="lo">Log out</button><button class="btn red" id="rs">Delete all entries</button></div></div></div>`;
}

const PAGES={dashboard,invoices,ledger,statements,settings};
function dl(name,txt,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type}));a.download=name;a.click()}
async function logout(){if(sb)await sb.auth.signOut();localStorage.setItem('ll_in','0');D=null;uid=null;location.hash='#login';route()}

function appView(){
 $('#auth').hidden=true;$('#app').hidden=false;
 const k=location.hash.slice(1),pg=PAGES[k]?k:'dashboard';
 document.querySelectorAll('aside .nav').forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#'+pg));
 const left=Math.max(0,Math.ceil((D.profile.trialEnd-Date.now())/864e5));
 $('#trial').innerHTML=`<b>${left} day${left===1?'':'s'}</b>left in your free trial`;
 $('#page').innerHTML=PAGES[pg]();document.title='LedgerLine – '+pg[0].toUpperCase()+pg.slice(1);
 const P=$('#page');
 P.querySelectorAll('.tilt').forEach(c=>{c.onpointermove=e=>{const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;c.style.transform=`rotateY(${x*9}deg) rotateX(${-y*9}deg) translateZ(6px)`};c.onpointerleave=()=>c.style.transform=''});
 const redo=async()=>{await save();appView()};
 if(pg==='invoices'){
  $('#iv').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);D.invoices.push({id:Date.now(),no:'INV-'+String(D.invoices.length+1).padStart(3,'0'),client:f.get('c'),amount:+f.get('a'),due:f.get('d'),note:f.get('n'),status:'unpaid'});redo()};
  P.querySelectorAll('[data-paid]').forEach(b=>b.onclick=()=>{const i=D.invoices.find(x=>x.id==b.dataset.paid);i.status='paid';D.entries.push({id:Date.now(),date:today(),type:'in',category:'Invoice '+i.no,amount:i.amount,note:i.client});redo()});
  P.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(confirm('Delete this invoice?')){D.invoices=D.invoices.filter(x=>x.id!=b.dataset.del);redo()}});
 }
 if(pg==='ledger'){
  $('#lf').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);D.entries.push({id:Date.now(),date:f.get('d'),type:f.get('t'),category:f.get('c'),amount:+f.get('a'),note:f.get('n')});redo()};
  P.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(confirm('Delete this entry?')){D.entries=D.entries.filter(x=>x.id!=b.dataset.del);redo()}});
 }
 if(pg==='statements'){
  P.querySelectorAll('[data-per]').forEach(b=>b.onclick=()=>{per=b.dataset.per;appView()});
  $('#pr').onclick=()=>print();
  $('#csv').onclick=()=>dl('ledgerline-cashbook.csv','Date,Type,Category,Amount,Note\n'+D.entries.map(e=>[e.date,e.type,e.category,e.amount,e.note].map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n'),'text/csv');
 }
 if(pg==='settings'){
  $('#ex').onclick=()=>dl('ledgerline-data.json',JSON.stringify(D,null,2),'application/json');
  $('#lo').onclick=logout;
  $('#rs').onclick=()=>{if(confirm('Delete all cash book entries and invoices? This cannot be undone.')){D.entries=[];D.invoices=[];redo()}};
 }
}

/* ---------- router ---------- */
async function route(){
 const h=location.hash;
 if(!D&&!uid){
  if(sb){const{data}=await sb.auth.getSession();if(data.session){uid=data.session.user.id;await load()}}
  else if(localStorage.getItem('ll_in')==='1')await load();
 }
 if(!D){if(h!=='#login'&&h!=='#signup'){location.hash='#signup';return}authView();return}
 if(h==='#login'||h==='#signup'||!h){location.hash='#dashboard';return}
 appView();
}
addEventListener('hashchange',route);route();

/* ---------- 3D coin on auth screen ---------- */
(function(){
 const cv=$('#coin');if(!window.THREE)return;let R;try{R=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true})}catch(e){return}
 R.setPixelRatio(Math.min(devicePixelRatio,2));
 const S=new THREE.Scene(),C=new THREE.PerspectiveCamera(38,1,.1,50);C.position.z=9;
 S.add(new THREE.AmbientLight(0x8a7bff,.8));
 [[0x41e0ff,2.4,[6,4,6]],[0xffd28a,2.8,[-5,3,6]]].forEach(([c,i,p])=>{const l=new THREE.PointLight(c,i,50);l.position.set(...p);S.add(l)});
 const g=new THREE.Group();S.add(g);const gold=new THREE.MeshStandardMaterial({color:0xffc861,metalness:.9,roughness:.25}),geo=new THREE.CylinderGeometry(1.15,1.15,.22,64);
 for(let i=0;i<6;i++){const m=new THREE.Mesh(geo,gold);m.position.set(Math.sin(i*1.7)*.1,-1+i*.3,0);m.rotation.y=i*.6;g.add(m)}
 const f=new THREE.Mesh(geo,gold);f.position.y=1.4;f.rotation.z=Math.PI/2;g.add(f);
 const rg=new THREE.Mesh(new THREE.TorusGeometry(2.6,.014,8,200),new THREE.MeshBasicMaterial({color:0x41e0ff}));rg.rotation.x=1.25;g.add(rg);
 let pw=0,ph=0;function sz(){const w=cv.clientWidth,h=cv.clientHeight;if(!w||!h||(w===pw&&h===ph))return;pw=w;ph=h;R.setSize(w,h,false);C.aspect=w/h;C.updateProjectionMatrix()}
 addEventListener('resize',sz);sz();
 const still=matchMedia('(prefers-reduced-motion:reduce)').matches,k=new THREE.Clock();
 (function loop(){const t=k.getElapsedTime();g.rotation.y=t*.4;f.rotation.x=t*1.6;rg.rotation.z=t*.2;sz();R.render(S,C);if(!still)requestAnimationFrame(loop)})();
})();
</script>
