U=session.user;localStorage.setItem("ledgerline_seen","1");const q=t=>{const x=sb.from(t).select();return CID?x.eq("client_id",CID):x.is("client_id",null)};const[p,i,e,c]=await Promise.all([sb.from("profiles").select().eq("id",U.id).single(),q("invoices").order("created_at",{ascending:false}),q("entries").order("entry_date",{ascending:false}),sb.from("clients").select().order("name")]);CL=c.data||[];if(p.error||!p.data){document.body.innerHTML='<div class="auth"><div class="card"><h3>We could not load your account</h3><p>Please refresh. If it keeps happening, contact support.</p><p style="font-size:12px;color:#586174">'+esc(p.error?p.error.message:"profile missing")+'</p><button class="btn" onclick="location.reload()">Refresh</button></div></div>';return}

<div class="grid" style="margin-top:16px"><div class="card"><h3>Profit and loss</h3><table><tr><td>Sales (excl. tax)</td><td class="r">${m(f.rev)}</td></tr><tr><td>Other income</td><td class="r">${m(f.oi)}</td></tr>${Object.entries(f.ex).map(([k,v])=>`<tr><td>Less: ${esc(k)}</td><td class="r">(${m(v)})</td></tr>`).join("")}<tr class="t"><td>Net profit</td><td class="r">${m(f.np)}</td></tr></table></div>
<div class="card"><h3>Balance sheet</h3><table><tr><th>Assets</th><th></th></tr><tr><td>Cash</td><td class="r">${m(f.cash)}</td></tr><tr><td>Receivables</td><td class="r">${m(f.rec)}</td></tr><tr class="t"><td>Total assets</td><td class="r">${m(A)}</td></tr>
<tr><th style="padding-top:16px">Liabilities and equity</th><th></th></tr><tr><td>Loans</td><td class="r">${m(f.loan)}</td></tr><tr><td>Tax collected, to remit</td><td class="r">${m(f.tax)}</td></tr><tr><td>Owner capital</td><td class="r">${m(f.cap)}</td></tr><tr><td>Retained profit</td><td class="r">${m(f.np)}</td></tr><tr class="t"><td>Total</td><td class="r">${m(L+E)}</td></tr></table></div></div>
<p style="margin-top:14px"><button class="btn d" onclick="print()">Print / save as PDF</button> <button class="btn o s" style="color:var(--ink)" id="exp">Export all data (JSON)</button></p>`}
function inv(){return`<div class="card"><h3>New invoice</h3><div class="row"><div><label>Client</label><input id="ic"></div><div><label>Date</label><input id="id" type="date" value="${today()}"></div><div><label>Tax %</label><input id="it" type="number" value="0"></div></div>
<label>Lines, one per row: description, qty, rate</label><textarea id="il" rows="3" placeholder="Monthly bookkeeping, 1, 500"></textarea><div class="err" id="ie"></div><button class="btn" id="isv">Create invoice</button></div>
<div class="card" style="margin-top:16px"><h3>Invoices</h3>${INV.length?`<table><tr><th>No.</th><th>Client</th><th class="r">Total</th><th>Status</th><th></th></tr>${INV.map(x=>`<tr><td>${esc(x.number)}</td><td>${esc(x.client)}</td><td class="r">${m(x.total)}</td><td><span class="pill ${x.status}">${x.status}</span></td><td class="r">${x.status!="paid"?`<button class="btn s" data-pd="${x.id}">Mark paid</button> `:""}<button class="btn s d" data-pr="${x.id}">Print</button></td></tr>`).join("")}</table>`:"<p style='color:var(--m)'>No invoices yet.</p>"}</div>`}
function cb(){return`<div class="card"><h3>New entry</h3><div class="row"><div><label>Date</label><input id="cd" type="date" value="${today()}"></div><div><label>Type</label><select id="ct"><option value="in">Money in</option><option value="out">Money out</option></select></div><div><label>Category</label><select id="cc"></select></div><div><label>Amount</label><input id="ca" type="number" step="0.01"></div></div><label>Note</label><input id="cn"><div class="err" id="ce"></div><button class="btn" id="csv">Add entry</button></div>
<div class="card" style="margin-top:16px"><h3>Cash book</h3>${ENT.length?`<table><tr><th>Date</th><th>Category</th><th>Note</th><th class="r">In</th><th class="r">Out</th><th></th></tr>${ENT.map(x=>`<tr><td>${x.entry_date}</td><td>${esc(x.category)}</td><td>${esc(x.note)}</td><td class="r">${x.type=="in"?m(x.amount):""}</td><td class="r">${x.type=="out"?m(x.amount):""}</td><td class="r"><button class="btn s o" style="color:var(--m)" data-del="${x.id}">×</button></td></tr>`).join("")}</table>`:"<p style='color:var(--m)'>No entries yet.</p>"}</div>`}
function wire(){const on=(s,f)=>{const e=$(s);if(e)e.onclick=f};
on("#cadd",async()=>{const n=$("#cn2").value.trim();if(!n)return;const{error}=await sb.from("clients").insert({name:n});if(error){$("#cle").textContent=error.message;return}tab="cl";await boot()});
document.querySelectorAll("[data-oc]").forEach(b=>b.onclick=async()=>{CID=b.dataset.oc||null;tab="ov";await boot()});
const cat=()=>{if($("#ct"))$("#cc").innerHTML=($("#ct").value=="in"?CI:CO).map(c=>`<option>${c}</option>`).join("")};if($("#ct")){cat();$("#ct").onchange=cat}
on("#exp",()=>{const u=URL.createObjectURL(new Blob([JSON.stringify({profile:P,invoices:INV,entries:ENT},null,2)],{type:"application/json"})),a=document.createElement("a");a.href=u;a.download="ledgerline-data.json";a.click()});
on("#csv",async()=>{const a=+$("#ca").value;if(!(a>0)){$("#ce").textContent="Enter an amount above zero.";return}const{error}=await sb.from("entries").insert({entry_date:$("#cd").value,type:$("#ct").value,category:$("#cc").value,amount:a,note:$("#cn").value.trim(),client_id:CID});if(error){$("#ce").textContent=error.message;return}await boot()});
on("#isv",async()=>{const it=$("#il").value.split("\n").map(l=>l.split(",").map(x=>x.trim())).filter(l=>l[0]&&+l[1]>0&&+l[2]>=0).map(l=>({d:l[0],q:+l[1],r:+l[2]}));if(!$("#ic").value.trim()||!it.length){$("#ie").textContent="Enter a client and at least one valid line.";return}
const sub=it.reduce((s,x)=>s+x.q*x.r,0),rate=+$("#it").value||0,tax=sub*rate/100,{error}=await sb.from("invoices").insert({number:"INV-"+String(INV.length+1).padStart(4,"0"),client:$("#ic").value.trim(),issue_date:$("#id").value,items:it,tax_rate:rate,subtotal:sub,tax,total:sub+tax,client_id:CID});if(error){$("#ie").textContent=error.message;return}await boot()});
document.querySelectorAll("[data-pd]").forEach(b=>b.onclick=async()=>{const x=INV.find(i=>i.id==b.dataset.pd);await sb.from("invoices").update({status:"paid"}).eq("id",x.id);await sb.from("entries").insert({entry_date:today(),type:"in",category:"Invoice receipt",amount:x.total,note:x.number+" "+x.client,invoice_id:x.id,client_id:CID});await boot()});
document.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{if(confirm("Delete this entry?")){await sb.from("entries").delete().eq("id",b.dataset.del);await boot()}});
document.querySelectorAll("[data-pr]").forEach(b=>b.onclick=()=>{const x=INV.find(i=>i.id==b.dataset.pr),w=open("","_blank");w.document.write(`<title>${esc(x.number)}</title><body style="font:15px system-ui;max-width:640px;margin:40px auto"><h1>Invoice ${esc(x.number)}</h1><p><b>${esc(P.business)}</b><br>Bill to: ${esc(x.client)}<br>Date: ${x.issue_date}</p><table style="width:100%;border-collapse:collapse">${x.items.map(i=>`<tr><td style="padding:8px;border-top:1px solid #ddd">${esc(i.d)}</td><td>${i.q} × ${m(i.r)}</td><td style="text-align:right">${m(i.q*i.r)}</td></tr>`).join("")}</table><p style="text-align:right">Subtotal ${m(x.subtotal)}<br>Tax (${x.tax_rate}%) ${m(x.tax)}<br><b>Total ${m(x.total)}</b></p>`);w.document.close();w.print()})}
boot();
</script></body></html>
